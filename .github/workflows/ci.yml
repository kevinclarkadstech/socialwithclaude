name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels the run for its previous commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The API and the shared package.
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The built API runs on Node (see the start script), so the smoke test does too.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - name: Typecheck shared
        run: bun run --cwd packages/shared typecheck
      - name: Test shared
        run: bun run --cwd packages/shared test
      - name: Typecheck API
        run: bun run --cwd apps/api typecheck
      - name: Lint API
        run: bun run --cwd apps/api lint
      - name: Test API
        run: bun run --cwd apps/api test
      - name: Build API
        run: bun run --cwd apps/api build
      # Starts the build and checks responses keep their status (a Nitro release turned errors into 200s).
      - name: Smoke test API
        run: bun run --cwd apps/api smoke

  # The Ionic app (web and Capacitor share one build).
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Vitest and jsdom run on Node (jsdom 31 needs 22.22.2+ or 24.15+), so pin it rather than take the runner's.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - name: Typecheck app
        run: bun run --cwd apps/app typecheck
      - name: Lint app
        run: bun run --cwd apps/app lint
      - name: Test app
        run: bun run --cwd apps/app test
      - name: Build app
        run: bun run --cwd apps/app build
