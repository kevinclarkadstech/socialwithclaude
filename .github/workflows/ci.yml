name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels the run for its previous commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The API and the shared package.
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The built API runs on Node (see the start script), so the smoke test does too.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - name: Typecheck shared
        run: bun run --cwd packages/shared typecheck
      - name: Test shared
        run: bun run --cwd packages/shared test
      - name: Typecheck API
        run: bun run --cwd apps/api typecheck
      - name: Lint API
        run: bun run --cwd apps/api lint
      - name: Test API
        run: bun run --cwd apps/api test
      - name: Build API
        run: bun run --cwd apps/api build
      # Starts the build and checks responses keep their status (a Nitro release turned errors into 200s).
      - name: Smoke test API
        run: bun run --cwd apps/api smoke

  # The API's routers against a real Postgres: who can see and do what (privacy, blocks, follows,
  # comments, saves, search, chats). The database is a throwaway service container.
  api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      # Its name must end in _test: the tests empty it first (integration/harness/preload.ts).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Integration tests
        run: bun run --cwd apps/api test:integration

  # The API built for Cloudflare Workers, run on Cloudflare's own runtime (wrangler dev) against a
  # real Postgres: a client per request, signing up, a push through the queue, the Cron Triggers and
  # a Rate Limiting binding (scripts/workers-smoke.ts).
  api-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Apply the migrations
        env:
          PGPASSWORD: postgres
        run: |
          for migration in apps/api/drizzle/*/migration.sql; do
            sed 's/--> statement-breakpoint//' "$migration" | psql -h localhost -U postgres -d app -v ON_ERROR_STOP=1 -q
          done
      - name: Build for Workers
        run: bun run --cwd apps/api build:cloudflare
      - name: Smoke test on workerd
        env:
          WORKERS_SMOKE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
        run: bun run --cwd apps/api smoke:workers

  # The Ionic app (web and Capacitor share one build).
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Vitest and jsdom run on Node (jsdom 31 needs 22.22.2+ or 24.15+), so pin it rather than take the runner's.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - name: Typecheck app
        run: bun run --cwd apps/app typecheck
      - name: Lint app
        run: bun run --cwd apps/app lint
      - name: Test app
        run: bun run --cwd apps/app test
      - name: Build app
        run: bun run --cwd apps/app build
      # Serves the build the way Cloudflare will (wrangler dev, wrangler.jsonc, public/_headers): app
      # routes load the app, the .well-known files are JSON, built scripts are cached for good.
      - name: Smoke test on Cloudflare
        run: bun run --cwd apps/app smoke:cloudflare
